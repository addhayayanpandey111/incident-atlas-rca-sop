name: Quality gates
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-evidence
          path: evaluation/results/
  compose-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: docker compose up --build --wait --wait-timeout 180
      - run: python scripts/smoke_http.py
      - run: docker compose logs --no-color > compose.log
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-evidence
          path: compose.log
      - run: docker compose down
        if: always()
